# Builds the controller firmware for every motor-driver variant, packages the
# installer app (Windows, Linux, macOS) with that firmware inside, and
# publishes both as the "firmware-latest" release.
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "flasher/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Robot core tests (all three driver settings)
        run: |
          make -C firmware/test run
          for d in SCORBOT_POLOLU_4035 SCORBOT_DRV8876; do
            g++ -std=c++17 -O2 -Wall -Wextra -D$d -Ifirmware/main firmware/test/test_core.cpp \
              firmware/main/core/robot.cpp firmware/main/core/config.cpp -o /tmp/t && /tmp/t
          done

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build all driver variants
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 flasher/build_firmware.py --out dist/firmware --zip dist/scorbot-firmware.zip \
            --version "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: scorbot-firmware
          path: dist/scorbot-firmware.zip

  app:
    needs: build
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: ScorbotFlasher-windows.exe
          - os: ubuntu-22.04          # older glibc, so the binary runs on more distros
            asset: ScorbotFlasher-linux.tar.gz
          - os: macos-latest
            asset: ScorbotFlasher-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: scorbot-firmware
      - name: Package the installer
        shell: bash
        run: |
          python -m pip install pyinstaller==6.11.1
          python -c "import zipfile; zipfile.ZipFile('scorbot-firmware.zip').extractall('flasher')"
          python flasher/build_app.py
          cd flasher/dist
          case "${{ matrix.os }}" in
            windows-*) mv ScorbotFlasher.exe "${{ matrix.asset }}" ;;
            ubuntu-*)  tar czf "${{ matrix.asset }}" ScorbotFlasher ;;
            macos-*)   zip -q "${{ matrix.asset }}" ScorbotFlasher ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: flasher/dist/${{ matrix.asset }}

  release:
    if: github.ref == 'refs/heads/main'
    needs: [host-tests, build, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Replace the firmware-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firmware-latest -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create firmware-latest assets/* -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Latest firmware (main)" \
            --notes "Built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download ScorbotFlasher for your computer (Windows .exe, Linux, macOS), run it, and follow the steps in the browser. scorbot-firmware.zip is the bare firmware."
