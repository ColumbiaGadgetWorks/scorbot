# Builds the controller firmware for every motor-driver variant, publishes the
# web installer with that firmware on GitHub Pages, and attaches the firmware
# zip to the "firmware-latest" release.
name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "flasher/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Robot core tests (all three driver settings)
        run: |
          make -C firmware/test run
          for d in SCORBOT_POLOLU_4035 SCORBOT_DRV8876; do
            g++ -std=c++17 -O2 -Wall -Wextra -D$d -Ifirmware/main firmware/test/test_core.cpp \
              firmware/main/core/robot.cpp firmware/main/core/config.cpp -o /tmp/t && /tmp/t
          done

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build all driver variants
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 flasher/build_firmware.py --out dist/firmware --zip dist/scorbot-firmware.zip \
            --version "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: scorbot-firmware
          path: dist/scorbot-firmware.zip

  pages:
    # The installer page plus the firmware just built, at
    # https://columbiagadgetworks.github.io/scorbot/
    if: github.ref == 'refs/heads/main'
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scorbot-firmware
      - name: Assemble the site
        run: |
          mkdir site
          cp flasher/index.html site/
          cp -r flasher/vendor site/
          python3 -c "import zipfile; zipfile.ZipFile('scorbot-firmware.zip').extractall('site')"
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main'
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scorbot-firmware
      - name: Replace the firmware-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firmware-latest -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create firmware-latest scorbot-firmware.zip -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Latest firmware (main)" \
            --notes "Built from ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC'). Install it from https://columbiagadgetworks.github.io/scorbot/ in Chrome or Edge."
